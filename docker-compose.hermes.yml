networks:
  dokploy-network:
    external: true

volumes:
  hermes-data-pvi:
    name: hermes-data-pvi
  browser-data-pvi:
    name: browser-data-pvi

services:
  # ── Hermes (Gateway + Dashboard) ──────────────────────────────────────────
  # Gateway API port 8642 — Dashboard port 9119
  # Assign domain di Dokploy ke service ini → port 9119
  hermes-pvi:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-pvi
    restart: unless-stopped
    command: ["gateway", "run"]
    volumes:
      - hermes-data-pvi:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${API_SERVER_KEY}
      - BROWSER_CDP_URL=ws://browser-pvi:9223
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      # URL publik dashboard (wajib jika di belakang reverse proxy / Traefik)
      - HERMES_DASHBOARD_PUBLIC_URL=${HERMES_DASHBOARD_PUBLIC_URL}
    shm_size: 1g
    networks:
      - dokploy-network
    depends_on:
      - browser-pvi

  # ── Stealth CDP Browser ────────────────────────────────────────────────────
  # Headless Chromium dengan stealth profile, anti-bot detection
  # Internal CDP endpoint: http://browser-pvi:9223 (nginx proxy → Chrome 9222)
  browser-pvi:
    image: coollabsio/openclaw-browser:latest
    container_name: browser-pvi
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Jakarta}
      - CHROME_CLI=--remote-debugging-port=9222
    volumes:
      - browser-data-pvi:/config
    shm_size: 2g
    networks:
      - dokploy-network
